name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Build installable archives
        run: python scripts/build_pcm.py
      - name: Verify archives
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          expected = {
              'caid-chat-kicad10-pcm.zip': {'metadata.json', 'plugins/plugin.json', 'plugins/main.py', 'plugins/__init__.py'},
          }
          for name, required in expected.items():
              with ZipFile(Path('build') / name) as archive:
                  assert archive.testzip() is None
                  assert required <= set(archive.namelist())
          PY
